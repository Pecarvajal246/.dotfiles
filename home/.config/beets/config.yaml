directory: ~/Music
# Runtime state lives outside the dotfiles repo; podman-stacks-backup backs it up.
library: ~/.local/share/beets/library.db
statefile: ~/.local/share/beets/state.pickle
import:
    incremental: yes
    move: no
    copy: no
    write: yes
ignore_hidden: yes
plugins: lyrics fetchart embedart info mbsync fish musicbrainz
lyrics:
    auto: yes
    keep_synced: yes
    synced: yes
fetchart:
    auto: yes
embedart:
    auto: yes
    ifempty: yes
